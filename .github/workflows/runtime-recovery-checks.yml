name: Runtime recovery fixture checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixtures-and-build:
    name: Offline fixtures and frontend build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:scripts
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install fixture test dependencies
        run: python -m pip install -r .github/requirements-runtime-recovery.txt

      # Explicit fixture suites only: no main_api startup, private input download,
      # broker requests, collection, training job, or deployment is invoked.
      - name: Check runtime state, preview isolation, and replay evidence
        run: >-
          python -m pytest -q
          backend/tests/test_runtime_status.py
          backend/tests/test_public_read_only.py
          backend/tests/test_owner_auth.py
          backend/tests/test_profit_signal_candidates.py
          backend/tests/test_profit_signal_shadow.py
          backend/tests/test_profit_shadow_artifact.py
          backend/tests/test_profit_shadow_observer.py
          backend/tests/test_profit_shadow_integration.py
          backend/tests/test_explicit_execution_startup.py
          backend/tests/test_research_execution.py
          backend/tests/test_holding_integration.py
          backend/tests/test_intraday_liquidation.py
          scripts/tests/test_build_profit_shadow_artifact.py
          tests/test_financial_sentiment_preview.py
          scripts/tests/test_replay_sentiment_ablations.py
          scripts/tests/test_probe_sentiment_reproduction.py

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend state and accounting fixtures
        working-directory: frontend
        run: node --test tests/*.test.mjs

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

  course-container:
    name: Portable course notebook replay (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Export public course files
        run: python scripts/export_course_project.py "$RUNNER_TEMP/course-project"
      - name: Build official course template image
        run: docker build -t quant-ai-course:check "$RUNNER_TEMP/course-project"
      - name: Refit and execute both notebooks offline
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$RUNNER_TEMP/course-project,target=/workspace" \
            --workdir /workspace quant-ai-course:check bash -lc '
              python -m unittest test_financial_sentiment -v &&
              jupyter nbconvert --to notebook --execute financial_sentiment.API.ipynb --output-dir executed &&
              jupyter nbconvert --to notebook --execute financial_sentiment.example.ipynb --output-dir executed
            '
