name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Install Git LFS and Configure Git
        run: |
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://Ypeng12:${HF_TOKEN}@huggingface.co/spaces/Ypeng12/quant-ai main:main || echo "HF push warning, skipping"
          else
            echo "HF_TOKEN secret not configured on GitHub, skipping HF git push action"
          fi
