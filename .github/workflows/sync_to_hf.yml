name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          if [ -n "$HF_TOKEN" ]; then
            printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) echo Ypeng12 ;; *Password*) printf "%s\n" "$HF_TOKEN" ;; esac' > "$RUNNER_TEMP/hf-askpass.sh"
            chmod 700 "$RUNNER_TEMP/hf-askpass.sh"
            export GIT_ASKPASS="$RUNNER_TEMP/hf-askpass.sh"
            export GIT_TERMINAL_PROMPT=0
            git push https://huggingface.co/spaces/Ypeng12/quant-ai HEAD:main
          else
            echo "HF_TOKEN secret not configured on GitHub, skipping HF git push action"
          fi
